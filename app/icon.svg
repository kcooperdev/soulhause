<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#F0EAD8"/>
  <defs>
    <clipPath id="house-clip">
      <polygon points="16,6 5,14 5,26 27,26 27,14"/>
    </clipPath>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F5C430"/>
      <stop offset="35%"  stop-color="#E8903A"/>
      <stop offset="65%"  stop-color="#D86040"/>
      <stop offset="100%" stop-color="#C04428"/>
    </linearGradient>
  </defs>
  <!-- sun clipped inside house -->
  <circle cx="16" cy="20" r="11" fill="url(#sun)" clip-path="url(#house-clip)"/>
  <!-- house outline -->
  <polyline points="4,14.5 16,6 28,14.5" fill="none" stroke="#4A8B78" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="6.5" y="14" width="19" height="12" rx="0.5" fill="none" stroke="#4A8B78" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- chimney -->
  <rect x="22" y="7.5" width="3" height="4.5" rx="0.4" fill="none" stroke="#4A8B78" stroke-width="2" stroke-linejoin="round"/>
</svg>
